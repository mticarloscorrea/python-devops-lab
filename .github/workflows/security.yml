name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit safety

      - name: Run Bandit
        run: |
          bandit -r app

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --ignore-vuln CVE-2025-71176

      - name: Run Safety
        run: |
          safety check -r requirements.txt