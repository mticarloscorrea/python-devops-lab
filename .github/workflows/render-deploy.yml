name: Deploy to Render

on:
  workflow_run:
    workflows:
      - Python Tests
      - Security Scan
      - Pylint
      - Trivy Scan
      - Docker Publish
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"